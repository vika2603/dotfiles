# Atuin config. Run `atuin default-config` to see all options with docs.
# Backup of the previous fully-commented version: ./config.toml.bak

style = "compact"
inline_height = 20
show_preview = true
max_preview_height = 4
enter_accept = true
invert = true

[sync]
records = true

[ui]
columns = ["exit", "duration", "time", { type = "directory", width = 24 }, "command"]

[theme]
name = "pastel"

[ai]
enabled = false
